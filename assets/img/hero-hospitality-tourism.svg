<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="55%" stop-color="#0a0e15"/>
      <stop offset="100%" stop-color="#0c121b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#29b6ff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#29b6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#29b6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ecbff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5ecbff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#29b6ff" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="dotsFade" cx="71%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotsMask">
      <rect width="1920" height="1080" fill="url(#dotsFade)"/>
    </mask>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="1460" cy="240" r="480" fill="url(#glowA)" filter="url(#blurLg)"/>
  <circle cx="1700" cy="700" r="320" fill="url(#glowB)" filter="url(#blurLg)"/>
  <circle cx="210" cy="860" r="260" fill="url(#glowB)" filter="url(#blurMd)" opacity="0.5"/>
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotsMask)"/>


  <path d="M -100 650 L 260 650 L 320 530 L 400 770 L 470 650 L 1010 650"
        fill="none" stroke="#29b6ff" stroke-width="2.5" stroke-opacity="0.5"
        stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <path d="M 1010 650 L 1180 650 L 1230 570 L 1290 730 L 1340 650 L 2020 650"
        fill="none" stroke="#5ecbff" stroke-width="2.5" stroke-opacity="0.28"
        stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>


  <g transform="translate(1300,150)" opacity="0.9">
    <!-- hotel facade -->
    <g stroke="#5ecbff" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <rect x="60" y="40" width="360" height="440" rx="4"/>
      <path d="M60 480 L420 480"/>
      <path d="M120 100 L160 100 L160 140 L120 140 Z"/>
      <path d="M200 100 L240 100 L240 140 L200 140 Z"/>
      <path d="M280 100 L320 100 L320 140 L280 140 Z"/>
      <path d="M120 180 L160 180 L160 220 L120 220 Z"/>
      <path d="M200 180 L240 180 L240 220 L200 220 Z"/>
      <path d="M280 180 L320 180 L320 220 L280 220 Z"/>
      <path d="M120 260 L160 260 L160 300 L120 300 Z"/>
      <path d="M200 260 L240 260 L240 300 L200 300 Z"/>
      <path d="M280 260 L320 260 L320 300 L280 300 Z"/>
      <path d="M190 360 L290 360 L290 480 L190 480 Z"/>
    </g>
    <!-- palm tree -->
    <g transform="translate(470,260)" stroke="#29b6ff" stroke-opacity="0.30" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <path d="M20 260 L30 60"/>
      <path d="M30 60 C-20 30 -50 40 -70 10"/>
      <path d="M30 60 C80 20 110 30 140 -6"/>
      <path d="M30 60 C10 10 20 -20 0 -50"/>
      <path d="M30 60 C55 15 90 5 110 -30"/>
    </g>
    <!-- compass -->
    <g transform="translate(120,560)" stroke="#5ecbff" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <circle cx="0" cy="0" r="60"/>
      <path d="M0 -40 L14 0 L0 40 L-14 0 Z"/>
    </g>
  </g>

  <circle cx="1720" cy="180" r="4" fill="#5ecbff" fill-opacity="0.5"/>
  <circle cx="1790" cy="420" r="3" fill="#29b6ff" fill-opacity="0.5"/>
  <circle cx="1620" cy="880" r="4" fill="#5ecbff" fill-opacity="0.4"/>
  <circle cx="1860" cy="650" r="3" fill="#29b6ff" fill-opacity="0.45"/>


  <rect width="1000" height="1080" fill="#05070a" fill-opacity="0.35"/>
  <rect width="1920" height="1080" fill="url(#leftFade)"/>

</svg>
